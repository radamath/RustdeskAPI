# ════════════════════════════════════════════════════════════════════
# Portainer WEB EDITOR ile deploy: BU DOSYAYI kullanın.
#
# "build: / context: ./rdgen-patched" OLAN YAML'ı Web Editor'de ASLA deploy ETMEYİN.
# Portainer stack dosyasını /data/compose/... altında tutar; orada rdgen-patched
# klasörü YOKTUR → build adımı patlar → genelde HTTP 500. İmajı SSH'ta build
# etmiş olman bu hatayı düzeltmez; Web Editor yine yanlış dizinde build dener.
#
# Önce SSH (repo kökünde):
#   docker build -t rdgen-patched:local -f rdgen-patched/Dockerfile rdgen-patched
#
# Sonra bu dosyayı yapıştır. ${...} için: Stack → Environment (GHBEARER, şifreler, vb.)
# shared-net: docker network create shared-net
# ════════════════════════════════════════════════════════════════════

services:
  hbbs:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbs
    command: ["hbbs", "-r", "${HBBS_RELAY_ADDR:-188.132.215.103:21117}"]
    restart: unless-stopped
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21118:21118"
    volumes:
      - rustdesk_data:/root
    networks:
      - shared-net

  hbbr:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbr
    command: hbbr
    restart: unless-stopped
    ports:
      - "21117:21117"
      - "21119:21119"
    volumes:
      - rustdesk_data:/root
    networks:
      - shared-net

  rdgen:
    image: rdgen-patched:local
    container_name: rdgen
    restart: unless-stopped
    environment:
      SECRET_KEY: "${RDGEN_SECRET_KEY}"
      GHUSER: "${GHUSER}"
      GHBEARER: "${GHBEARER}"
      GENURL: "${GENURL:-https://rustclient.alpaycatal.com/}"
      ZIP_PASSWORD: "${RDGEN_ZIP_PASSWORD}"
      GHBRANCH: "${GHBRANCH:-master}"
      PROTOCOL: "https"
      REPONAME: "${REPONAME:-rdgen}"
      DEBUG: "false"
    ports:
      - "8080:8000"
    dns:
      - 8.8.8.8
    volumes:
      - rdgen_exe:/opt/rdgen/exe
      - rdgen_png:/opt/rdgen/png
      - rdgen_zips:/opt/rdgen/temp_zips
    networks:
      - shared-net

  rustdesk-api:
    image: ghcr.io/radamath/rustdeskapi:latest
    container_name: rustdesk-api
    restart: unless-stopped
    ports:
      - "21114:21114"
    volumes:
      - rustdesk_data:/rustdesk-data:ro
      - api_data:/app/data
    environment:
      SECRET_KEY: "${API_SECRET_KEY}"
      RUSTDESK_DB: "/rustdesk-data/db_v2.sqlite3"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      RDGEN_INTERNAL_URL: "http://rdgen:8000"
      TRUST_PROXY: "${TRUST_PROXY:-1}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-https://rustclient.alpaycatal.com}"
      GENURL: "${GENURL:-https://rustclient.alpaycatal.com/}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-1}"
      SESSION_COOKIE_SAMESITE: "${SESSION_COOKIE_SAMESITE:-Lax}"
      STATIC_ASSET_VERSION: "${STATIC_ASSET_VERSION:-15}"
    depends_on:
      - hbbs
      - rdgen
    networks:
      - shared-net

volumes:
  rustdesk_data:
  api_data:
  rdgen_exe:
  rdgen_png:
  rdgen_zips:

networks:
  shared-net:
    external: true
