# ═══════════════════════════════════════════════════════════════════
# Portainer (Web Editor) — BU DOSYAYI kullanın. rdgen için BUILD SATIRI YOK.
# "build: context: ./rdgen-patched" Web Editor deploy'da çoğu zaman 500 verir
# (stack dizininde o klasör yoktur). İmajı önce SSH ile üretin:
#
#   cd /opt/RustdeskAPI   # klonladığınız repo kökü
#   docker build -t rdgen-patched:local -f rdgen-patched/Dockerfile rdgen-patched
#
# shared-net: docker network create shared-net
#
# Portainer → Stack → Environment (aynı isimlerle):
#   GHBEARER              GitHub fine-grained PAT (rdgen)
#   RDGEN_SECRET_KEY      Django secret (rdgen)
#   RDGEN_ZIP_PASSWORD    fork’taki ZIP_PASSWORD ile aynı
#   API_SECRET_KEY        Flask SECRET_KEY (rustdesk-api)
#   ADMIN_PASSWORD        panel şifresi
#   GENURL                https://rustclient.alpaycatal.com/  (fork Secret ile aynı)
#   PUBLIC_BASE_URL       https://rustclient.alpaycatal.com   (sonda / olmadan da olur)
#   GHUSER                radamath
#   ADMIN_USERNAME        alpaycatal
#
# GitHub fork Secrets: GENURL ve ZIP_PASSWORD bu ortamla uyumlu olmalı.
# ═══════════════════════════════════════════════════════════════════

services:
  hbbs:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbs
    command: ["hbbs", "-r", "${HBBS_RELAY_ADDR:-188.132.215.103:21117}"]
    restart: unless-stopped
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21118:21118"
    volumes:
      - rustdesk_data:/root
    networks:
      - shared-net

  hbbr:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbr
    command: hbbr
    restart: unless-stopped
    ports:
      - "21117:21117"
      - "21119:21119"
    volumes:
      - rustdesk_data:/root
    networks:
      - shared-net

  rdgen:
    image: rdgen-patched:local
    container_name: rdgen
    restart: unless-stopped
    environment:
      SECRET_KEY: "${RDGEN_SECRET_KEY}"
      GHUSER: "${GHUSER:-radamath}"
      GHBEARER: "${GHBEARER}"
      GENURL: "${GENURL:-https://rustclient.alpaycatal.com/}"
      ZIP_PASSWORD: "${RDGEN_ZIP_PASSWORD}"
      GHBRANCH: "${GHBRANCH:-master}"
      PROTOCOL: "https"
      REPONAME: "${REPONAME:-rdgen}"
      DEBUG: "false"
    ports:
      - "8080:8000"
    dns:
      - 8.8.8.8
    volumes:
      - rdgen_exe:/opt/rdgen/exe
      - rdgen_png:/opt/rdgen/png
      - rdgen_zips:/opt/rdgen/temp_zips
    networks:
      - shared-net

  rustdesk-api:
    image: ghcr.io/radamath/rustdeskapi:latest
    container_name: rustdesk-api
    restart: unless-stopped
    ports:
      - "21114:21114"
    volumes:
      - rustdesk_data:/rustdesk-data:ro
      - api_data:/app/data
    environment:
      SECRET_KEY: "${API_SECRET_KEY}"
      RUSTDESK_DB: "/rustdesk-data/db_v2.sqlite3"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-alpaycatal}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      RDGEN_INTERNAL_URL: "http://rdgen:8000"
      TRUST_PROXY: "${TRUST_PROXY:-1}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-https://rustclient.alpaycatal.com}"
      GENURL: "${GENURL:-https://rustclient.alpaycatal.com/}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-1}"
      SESSION_COOKIE_SAMESITE: "${SESSION_COOKIE_SAMESITE:-Lax}"
      STATIC_ASSET_VERSION: "${STATIC_ASSET_VERSION:-15}"
    depends_on:
      - hbbs
      - rdgen
    networks:
      - shared-net

volumes:
  rustdesk_data:
  api_data:
  rdgen_exe:
  rdgen_png:
  rdgen_zips:

networks:
  shared-net:
    external: true
