# shared-net: docker network create shared-net
# RDGen / fork Secrets: GENURL ve ZIP_PASSWORD fork ile aynı olmalı.

services:
  hbbs:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbs
    # İmajda Entrypoint/Cmd null → tam argv gerekir (sadece ["-r", ...] OLMAZ; Created kalır).
    command: ["hbbs", "-r", "188.132.215.103:21117"]
    restart: unless-stopped
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21118:21118"
    volumes:
      - rustdesk_data:/root
    networks:
      - shared-net

  hbbr:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbr
    command: hbbr
    restart: unless-stopped
    ports:
      - "21117:21117"
      - "21119:21119"
    volumes:
      - rustdesk_data:/root
    networks:
      - shared-net

  rdgen:
    image: bryangerlach/rdgen:latest
    container_name: rdgen
    restart: unless-stopped
    environment:
      SECRET_KEY: "${RDGEN_SECRET_KEY}"
      GHUSER: "${GHUSER:-radamath}"
      GHBEARER: "${GHBEARER}"
      GENURL: "${GENURL:-https://example.com/}"
      ZIP_PASSWORD: "${RDGEN_ZIP_PASSWORD}"
      GHBRANCH: "master"
      PROTOCOL: "https"
      REPONAME: "rdgen"
    ports:
      - "8080:8000"
    dns:
      - 8.8.8.8
    volumes:
      - rdgen_exe:/opt/rdgen/exe
      - rdgen_png:/opt/rdgen/png
      - rdgen_zips:/opt/rdgen/temp_zips
    networks:
      - shared-net

  rustdesk-api:
    image: ghcr.io/radamath/rustdeskapi:latest
    container_name: rustdesk-api
    restart: unless-stopped
    ports:
      - "21114:21114"
    volumes:
      - rustdesk_data:/rustdesk-data:ro
      - api_data:/app/data
    environment:
      SECRET_KEY: "${API_SECRET_KEY}"
      RUSTDESK_DB: "/rustdesk-data/db_v2.sqlite3"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      RDGEN_INTERNAL_URL: "http://rdgen:8000"
    depends_on:
      - hbbs
      - rdgen
    networks:
      - shared-net

volumes:
  rustdesk_data:
  api_data:
  rdgen_exe:
  rdgen_png:
  rdgen_zips:

networks:
  shared-net:
    external: true
