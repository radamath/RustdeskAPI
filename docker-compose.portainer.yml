# ── Portainer / docker compose stack ─────────────────────────────────
# Önce ağ:  docker network create shared-net
#
# Gizli değerleri bu dosyaya YAZMAYIN. Portainer → Stack → Environment
# veya .env ile: API_SECRET_KEY, RDGEN_SECRET_KEY, GHBEARER, ADMIN_PASSWORD,
# RDGEN_ZIP_PASSWORD, HBBS_RELAY_ADDR, PUBLIC_BASE_URL, GENURL, …
#
# rdgen BUILD: ./rdgen-patched klasörü compose dosyası ile AYNI dizinde olmalı
# (RustdeskAPI reposu kökü). Web editor’de sadece YAML yapıştırırsanız build PATLAR.
# Çözüm: Stack’i Git’ten verin veya sunucuda repo klonlayıp oradan deploy edin.
#
# İlk / Dockerfile değişince:
#   docker compose -f docker-compose.portainer.yml build --no-cache rdgen
#   docker compose -f docker-compose.portainer.yml up -d
#
# GitHub fork Secrets: GENURL ve ZIP_PASSWORD, rdgen ortamı ile aynı olmalı.

services:
  hbbs:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbs
    command: ["hbbs", "-r", "${HBBS_RELAY_ADDR:-127.0.0.1:21117}"]
    restart: unless-stopped
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21118:21118"
    volumes:
      - rustdesk_data:/root
    networks:
      - shared-net

  hbbr:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbr
    command: hbbr
    restart: unless-stopped
    ports:
      - "21117:21117"
      - "21119:21119"
    volumes:
      - rustdesk_data:/root
    networks:
      - shared-net

  rdgen:
    build:
      context: ./rdgen-patched
      dockerfile: Dockerfile
    image: rdgen-patched:local
    container_name: rdgen
    restart: unless-stopped
    environment:
      SECRET_KEY: "${RDGEN_SECRET_KEY}"
      GHUSER: "${GHUSER}"
      GHBEARER: "${GHBEARER}"
      GENURL: "${GENURL:-https://example.com/}"
      ZIP_PASSWORD: "${RDGEN_ZIP_PASSWORD}"
      GHBRANCH: "${GHBRANCH:-master}"
      PROTOCOL: "https"
      REPONAME: "${REPONAME:-rdgen}"
      DEBUG: "false"
    ports:
      - "8080:8000"
    dns:
      - 8.8.8.8
    volumes:
      - rdgen_exe:/opt/rdgen/exe
      - rdgen_png:/opt/rdgen/png
      - rdgen_zips:/opt/rdgen/temp_zips
    networks:
      - shared-net

  rustdesk-api:
    image: ghcr.io/radamath/rustdeskapi:latest
    container_name: rustdesk-api
    restart: unless-stopped
    ports:
      - "21114:21114"
    volumes:
      # rdgen_zips/temp_zips'i BURAYA bağlamayın (çift mount → rdgen PermissionError).
      - rustdesk_data:/rustdesk-data:ro
      - api_data:/app/data
    environment:
      SECRET_KEY: "${API_SECRET_KEY}"
      RUSTDESK_DB: "/rustdesk-data/db_v2.sqlite3"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      RDGEN_INTERNAL_URL: "http://rdgen:8000"
      TRUST_PROXY: "${TRUST_PROXY:-1}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"
      GENURL: "${GENURL:-}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-1}"
      SESSION_COOKIE_SAMESITE: "${SESSION_COOKIE_SAMESITE:-Lax}"
      STATIC_ASSET_VERSION: "${STATIC_ASSET_VERSION:-15}"
    depends_on:
      - hbbs
      - rdgen
    networks:
      - shared-net

volumes:
  rustdesk_data:
  api_data:
  rdgen_exe:
  rdgen_png:
  rdgen_zips:

networks:
  shared-net:
    external: true
