version: "3.8"

# =====================================================================
#  RustDesk Sunucu + Yonetim Paneli  —  Portainer Stack
# =====================================================================
#  Portainer'da "Add Stack" > "Repository" ile GitHub repo'nuzu
#  gösterin veya bu dosyayı "Web editor"e yapıştırın.
#
#  Kullanım:
#    1. Ortam değişkenlerini (SECRET_KEY, ADMIN_PASSWORD) değiştirin.
#    3. shared-net ağının daha önceden oluşturulmuş olması gerekir:
#         docker network create shared-net
# =====================================================================

services:
  hbbs:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbs
    command: hbbs
    restart: unless-stopped
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21118:21118"
    volumes:
      - rustdesk_data:/root
    networks:
      - shared-net

  hbbr:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbr
    command: hbbr
    restart: unless-stopped
    ports:
      - "21117:21117"
    volumes:
      - rustdesk_data:/root
    networks:
      - shared-net

  rustdesk-api:
    # ── Değiştirin: GITHUB_USER → kendi GitHub kullanıcı adınız ──
    image: ghcr.io/radamath/rustdeskapi:latest
    container_name: rustdesk-api
    restart: unless-stopped
    ports:
      - "21114:21114"
    volumes:
      - rustdesk_data:/rustdesk-data:ro
      - api_data:/app/data
    environment:
      - SECRET_KEY=buraya-guclu-bir-anahtar-yazin
      - RUSTDESK_DB=/rustdesk-data/db_v2.sqlite3
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
    depends_on:
      - hbbs
    networks:
      - shared-net

volumes:
  rustdesk_data:
  api_data:

networks:
  shared-net:
    external: true
