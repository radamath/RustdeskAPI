# Örnek stack — gerçek IP / şifreleri .env ile verin; bu dosyada gizli bilgi tutmayın.
# shared-net: docker network create shared-net
# RDGen: GENURL genelde panelin kök URL’si (https://panel.example.com/) olmalı; ZIP_PASSWORD fork ile uyumlu.

services:
  hbbs:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbs
    # Dışarıdan erişilen hbbr adresi (genelde sunucu_public_ip:21117)
    command: ["hbbs", "-r", "${HBBS_RELAY_ADDR:-127.0.0.1:21117}"]
    restart: unless-stopped
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21118:21118"
    volumes:
      - rustdesk_data:/root
    networks:
      - shared-net

  hbbr:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbr
    command: hbbr
    restart: unless-stopped
    ports:
      - "21117:21117"
      - "21119:21119"
    volumes:
      - rustdesk_data:/root
    networks:
      - shared-net

  # rdgen-patched: volume izinleri (temp_zips Permission denied) + apply_patch
  rdgen:
    build:
      context: ./rdgen-patched
      dockerfile: Dockerfile
    image: rdgen-patched:local
    restart: unless-stopped
    environment:
      SECRET_KEY: "${RDGEN_SECRET_KEY}"
      GHUSER: "${GHUSER:-your-github-username}"
      GHBEARER: "${GHBEARER}"
      GENURL: "${GENURL:-https://example.com/}"
      ZIP_PASSWORD: "${RDGEN_ZIP_PASSWORD}"
      GHBRANCH: "master"
      PROTOCOL: "https"
      REPONAME: "rdgen"
    ports:
      - "8080:8000"
    dns:
      - 8.8.8.8
    volumes:
      - rdgen_exe:/opt/rdgen/exe
      - rdgen_png:/opt/rdgen/png
      - rdgen_zips:/opt/rdgen/temp_zips
    networks:
      - shared-net

  rustdesk-api:
    image: ghcr.io/radamath/rustdeskapi:latest
    container_name: rustdesk-api
    restart: unless-stopped
    ports:
      - "21114:21114"
    volumes:
      # ÖNEMLİ: rdgen_zips / temp_zips'i BURAYA bağlamayın. Sadece rdgen kullanmalı.
      # İki konteyner aynı volume'u paylaşırsa biri root ile dosya oluşturur, rdgen (user) yazamaz.
      - rustdesk_data:/rustdesk-data:ro
      - api_data:/app/data
    environment:
      SECRET_KEY: "${API_SECRET_KEY}"
      RUSTDESK_DB: "/rustdesk-data/db_v2.sqlite3"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      RDGEN_INTERNAL_URL: "http://rdgen:8000"
      # HTTPS panel + ters proxy kullanıyorsanız: TRUST_PROXY=1, PUBLIC_BASE_URL=https://...
      TRUST_PROXY: "${TRUST_PROXY:-0}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-1}"
      # Tarayıcı önbelleği: kod güncellemesinden sonra artırın (örn. 14, 15)
      STATIC_ASSET_VERSION: "${STATIC_ASSET_VERSION:-13}"
    depends_on:
      - hbbs
      - rdgen
    networks:
      - shared-net

volumes:
  rustdesk_data:
  api_data:
  rdgen_exe:
  rdgen_png:
  rdgen_zips:

networks:
  shared-net:
    external: true
