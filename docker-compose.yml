# Yerel geliştirme / örnek — gizli değerleri .env dosyasına koyun.
version: "3.8"

services:
  hbbs:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbs
    command: ["hbbs", "-r", "${HBBS_RELAY_ADDR:-127.0.0.1:21117}"]
    restart: unless-stopped
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21118:21118"
    volumes:
      - rustdesk_data:/root
    networks:
      - shared-net

  hbbr:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbr
    command: hbbr
    restart: unless-stopped
    ports:
      - "21117:21117"
    volumes:
      - rustdesk_data:/root
    networks:
      - shared-net

  rustdesk-api:
    build: .
    container_name: rustdesk-api
    restart: unless-stopped
    ports:
      - "21114:21114"
    volumes:
      # rdgen_exe/png/zips volume'larını rustdesk-api'ye bağlamayın (PermissionError).
      - rustdesk_data:/rustdesk-data:ro
      - api_data:/app/data
    environment:
      - SECRET_KEY=${API_SECRET_KEY:-change-me-in-production}
      - RUSTDESK_DB=/rustdesk-data/db_v2.sqlite3
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - RDGEN_INTERNAL_URL=http://rdgen:8000
      - TRUST_PROXY=${TRUST_PROXY:-0}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - STATIC_ASSET_VERSION=${STATIC_ASSET_VERSION:-13}
    depends_on:
      - hbbs
      - rdgen
    networks:
      - shared-net

  rdgen:
    build:
      context: ./rdgen-patched
      dockerfile: Dockerfile
    image: rdgen-patched:local
    container_name: rdgen
    restart: unless-stopped
    environment:
      - SECRET_KEY=${RDGEN_SECRET_KEY}
      - GHUSER=${GHUSER:-your-github-username}
      - GHBEARER=${GHBEARER}
      - GENURL=${GENURL:-http://127.0.0.1:8080/}
      - ZIP_PASSWORD=${RDGEN_ZIP_PASSWORD}
      - GHBRANCH=master
      - PROTOCOL=http
      - REPONAME=rdgen
    ports:
      - "8080:8000"
    dns:
      - 8.8.8.8
    volumes:
      - rdgen_exe:/opt/rdgen/exe
      - rdgen_png:/opt/rdgen/png
      - rdgen_zips:/opt/rdgen/temp_zips
    networks:
      - shared-net

volumes:
  rustdesk_data:
  api_data:
  rdgen_exe:
  rdgen_png:
  rdgen_zips:

networks:
  shared-net:
    external: true
